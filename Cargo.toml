[package]
name = "redmine-mcp-rs"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol server for Redmine, in Rust"
license = "MIT"

[[bin]]
name = "redmine-mcp-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
